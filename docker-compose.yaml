services:
  
  db:
    image: postgres:15
    container_name: divar_db
    restart: unless-stopped


    env_file:
      - .env


    volumes:
      - postgres_data:/var/lib/postgresql/data


    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

    networks: 
      - backend


  web:
    build: .
    container_name: app_divar
    restart: unless-stopped


    command: >
      sh -c "
      python manage.py migrate &&
      python manage.py collectstatic --noinput &&
      gunicorn config.wsgi:application
      --bind 0.0.0.0:8000
      --workers 4
      --threads 2
      --timeout 120
      "

    volumes:
      - .:/usr/src/app

    ports:
      - "8000:8000"  

    depends_on:
      db:
        condition: service_healthy

    networks:
      - backend



volumes:
  postgres_data:


networks:
  backend:
  