services:

  web:
    build: .
    container_name: app_divar
    restart: unless-stopped

    command: >
      sh -c "
      python manage.py migrate &&
      python manage.py collectstatic --noinput &&
      gunicorn config.wsgi:application
      --bind 0.0.0.0:8000
      --workers 4
      --threads 2
      --timeout 120
      "

    volumes:
      - .:/usr/src/app

    ports:
      - "8000:8000"

    networks:
      - backend

networks:
  backend: